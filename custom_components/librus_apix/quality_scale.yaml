rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register custom actions.
  appropriate-polling: done
  brands: todo
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: todo
  docs-actions:
    status: exempt
    comment: The integration does not register custom actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration does not provide device or entity triggers.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe directly to external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not register custom actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no user-configurable runtime parameters.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Librus is an authenticated cloud service without discovery.
  discovery-update-info:
    status: exempt
    comment: The integration does not use discovery.
  docs-data-update: todo
  docs-examples: done
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: This is a cloud service integration rather than a device integration.
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry represents one Librus student account.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: done
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: No user-actionable repair conditions are currently exposed.
  stale-devices:
    status: exempt
    comment: The integration exposes one service device per config entry.

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
