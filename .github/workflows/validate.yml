name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # GitHub license detection can return SPDX: NOASSERTION for forks/PR refs
          # even when LICENSE contains the standard MIT text. License is verified
          # in the repository itself; skip only this metadata-based HACS check.
          ignore: "license"
