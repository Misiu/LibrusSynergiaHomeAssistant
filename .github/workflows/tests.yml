name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Ruff check
        run: ruff check --select E9,F custom_components/librus tests
      - name: Compile integration
        run: python -m compileall -q custom_components/librus tests
      - name: Run tests
        run: python -m pytest -q --cov=custom_components/librus --cov-report=term-missing --cov-fail-under=95
